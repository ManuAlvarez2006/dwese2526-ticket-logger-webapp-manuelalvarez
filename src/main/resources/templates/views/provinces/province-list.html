<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Ticket Logger - Home')"></head>

<body class="d-flex flex-column h-100">

<!-- Header -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido dinámico -->
<main class="list-page">
    <div class="list-card">

        <!-- Título de la lista -->
        <h1 th:text="#{msg.province-list.title}">Listado de Provincias</h1>

        <!-- Botón para añadir -->
        <a th:href="@{/provinces/new}" class="btn btn-success" th:text="#{msg.province-list.add}">
            Agregar Nueva Provincia
        </a>

        <!-- Mensaje de error -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Tabla -->
        <table class="table table-bordered table-striped mt-3">
            <thead>
            <tr>
                <!--ID-->
                <th th:with="
                order=${page.sort.getOrderFor('id')},
                dir=${order != null ? order.direction.name().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/provinces(page=${page.number}, sort=${'id,' + nextDir})}">
                        <span th:text="#{msg.province.list.id}">ID</span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>

                <!--Codigo-->
                <th th:with="
                order=${page.sort.getOrderFor('code')},
                dir=${order != null ? order.direction.name().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/provinces(page=${page.number}, sort=${'code,' + nextDir})}">
                        <span th:text="#{msg.province.list.code}">Código</span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>

                <!--Nombre-->
                <th th:with="
                order=${page.sort.getOrderFor('name')},
                dir=${order != null ? order.direction.name().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/provinces(page=${page.number}, sort=${'name,' + nextDir})}">
                        <span th:text="#{msg.province.list.name}">Nombre</span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>

                <!--Region-->
                <th th:with="
                order=${page.sort.getOrderFor('regionName')},
                dir=${order != null ? order.direction.name().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/provinces(page=${page.number}, sort=${'regionName,' + nextDir})}">
                        <span th:text="#{msg.province.list.region}">Región</span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>

                <th th:text="#{msg.province-list.actions}">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="province : ${page.content}">
                <td th:text="${province.id}"></td>
                <td th:text="${province.code}"></td>
                <td th:text="${province.name}"></td>
                <td th:text="${province.regionName}"></td>
                <td>
                    <!-- Ver detalle -->
                    <a th:href="@{/provinces/detail(id=${province.id})}"
                       class="btn btn-outline-secondary btn-sm me-1"
                       th:text="#{msg.province-list.viewDetail}">Detalle</a>

                    <a th:href="@{/provinces/edit(id=${province.id})}"
                       class="btn btn-primary btn-sm"
                       th:text="#{msg.province-list.edit}">Editar</a>

                    <form th:action="@{/provinces/delete}" method="post" class="d-inline">
                        <input type="hidden" name="id" th:value="${province.id}" />
                        <button type="submit" class="btn btn-danger btn-sm"
                                th:onclick="|return confirm('#{msg.province-list.confirm}');|"
                                th:text="#{msg.province-list.delete}">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Paginación -->
        <div class="d-flex justify-content-between align-items-center mt-3" th:if="${page.totalPages > 0}">
            <div>
                <span th:text="#{msg.pagination.info(${page.number} + 1, ${page.totalPages}, ${page.totalElements})}"></span>
            </div>
            <nav th:aria-label="#{msg.pagination.aria.label}">
                <ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/provinces(page=${page.number - 1}, size=${page.size}, sort=${sortParam})}"
                           th:aria-label="#{msg.pagination.prev}">&laquo;</a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                        th:classappend="${i} == ${page.number} ? ' active'">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/provinces(page=${i}, size=${page.size}, sort=${sortParam})}"></a>
                    </li>

                    <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/provinces(page=${page.number + 1}, size=${page.size}, sort=${sortParam})}"
                           th:aria-label="#{msg.pagination.next}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Botón volver -->
        <a th:href="@{/}" class="btn btn-secondary" th:text="#{msg.province-form.returnback}">Volver al inicio</a>
    </div>
</main>

<!-- Footer -->
<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>

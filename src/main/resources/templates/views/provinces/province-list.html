<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Ticket Logger - Home')"></head>

<body class="d-flex flex-column h-100">

<!-- Header -->
<header th:replace="fragments/header :: header"></header>

<main class="list-page">
    <div class="list-card">

        <!-- Título listado -->
        <h1 th:text="#{msg.province-list.title}"></h1>

        <!-- Botón para añadir nueva provincia -->
        <a th:href="@{/provinces/new}" class="btn btn-success"
           th:text="#{msg.province-list.add}"></a>

        <!-- Mensaje de error -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Tabla de provincias -->
        <table class="table table-bordered table-striped mt-3">
            <thead>
            <tr>
                <th>
                    <a class="text-decoration-none"
                       th:href="@{/provinces(page=${currentPage}, size=${pageSize}, sortField='id', sortDir=${(sortField == 'id') ? reverseSortDir : 'asc'})}">
                        <span th:text="#{msg.province-list.id}"></span>
                        <span class="ms-1" th:if="${sortField == 'id'}" th:text="${sortDir == 'asc'} ? '▲' : '▼'"></span>
                    </a>
                </th>
                <th>
                    <a class="text-decoration-none"
                       th:href="@{/provinces(page=${currentPage}, size=${pageSize}, sortField='code', sortDir=${(sortField == 'code') ? reverseSortDir : 'asc'})}">
                        <span th:text="#{msg.province-list.code}"></span>
                        <span class="ms-1" th:if="${sortField == 'code'}" th:text="${sortDir == 'asc'} ? 'A' : 'V'"></span>
                    </a>
                </th>
                <th>
                    <a class="text-decoration-none"
                       th:href="@{/provinces(page=${currentPage}, size=${pageSize}, sortField='name', sortDir=${(sortField == 'name') ? reverseSortDir : 'asc'})}">
                        <span th:text="#{msg.province-list.name}"></span>
                        <span class="ms-1" th:if="${sortField == 'name'}" th:text="${sortDir == 'asc'} ? '▲' : '▼'"></span>
                    </a>
                </th>
                <th>
                    <a class="text-decoration-none"
                       th:href="@{/provinces(page=${currentPage}, size=${pageSize}, sortField='regionName', sortDir=${(sortField == 'regionName') ? reverseSortDir : 'asc'})}">
                        <span th:text="#{msg.province-list.region}"></span>
                        <span class="ms-1" th:if="${sortField == 'regionName'}" th:text="${sortDir == 'asc'} ? '▲' : '▼'"></span>
                    </a>
                </th>
                <th th:text="#{msg.province-list.actions}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="province : ${listProvinces}">
                <td th:text="${province.id}"></td>
                <td th:text="${province.code}"></td>
                <td th:text="${province.name}"></td>
                <td th:text="${province.regionName}"></td>
                <td>
                    <a th:href="@{/provinces/detail(id=${province.id})}"
                       class="btn btn-info btn-sm"
                       th:text="#{msg.province-list.detail}"></a>

                    <a th:href="@{/provinces/edit(id=${province.id})}" class="btn btn-primary btn-sm"
                       th:text="#{msg.province-list.edit}"></a>

                    <form th:action="@{/provinces/delete}" method="post" class="d-inline">
                        <input type="hidden" name="id" th:value="${province.id}" />
                        <button type="submit" class="btn btn-danger btn-sm"
                                th:text="#{msg.province-list.delete}"
                                th:onclick="return confirm('#{msg.province-list.confirm}');"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center mt-3" th:if="${totalPages > 0}">
            <div>
                <span th:text="#{msg.pagination.info(${currentPage} + 1, ${totalPages}, ${totalElements})}"></span>
            </div>

            <nav th:aria-label="#{msg.pagination.aria.label}">
                <ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/provinces(page=${currentPage - 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
                           th:aria-label="#{msg.pagination.prev}">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i} == ${currentPage} ? ' active'">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/provinces(page=${i}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"></a>
                    </li>

                    <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/provinces(page=${currentPage + 1}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
                           th:aria-label="#{msg.pagination.next}">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <a th:href="@{/}" class="btn btn-secondary" th:text="#{msg.province-form.returnback}"></a>
    </div>
</main>
</body>
</html>

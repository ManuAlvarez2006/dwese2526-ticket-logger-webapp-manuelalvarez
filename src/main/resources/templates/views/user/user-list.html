<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Ticket Logger - Home')"></head>

<body class="d-flex flex-column h-100">

<!-- Header -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido dinámico -->
<main class="list-page">
    <div class="list-card">

        <!-- Título de la lista -->
        <h1 th:text="#{msg.user-list.title}">Listado de Usuarios</h1>

        <!-- Botón para añadir -->
        <a th:href="@{/users/new}" class="btn btn-success" th:text="#{msg.user-list.add}">
            Agregar Nuevo Usuario
        </a>

        <!-- Mensaje de error -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Tabla -->
        <table class="table table-bordered table-striped mt-3">
            <thead>
            <tr>
                <!--ID-->
                <th th:with="
                order=${page.sort.getOrderFor('id')},
                dir=${order != null ? order.direction.name().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">

                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page.number},
                       sort=${'id,' + nextDir})}">
                        <span th:text="#{msg.user.list.id}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>
                <!--Nombre de usuario-->
                <th th:with="
                order=${page.sort.getOrderFor('email')},
                dir=${order != null ? order.direction.name().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">

                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page.number},
                       sort=${'email,' + nextDir})}">
                        <span th:text="#{msg.user.list.email}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>
                <!--passwordHash-->
                <th th:with="
                order=${page.sort.getOrderFor('passwordHash')},
                dir=${order != null ? order.direction.passwordHash().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">

                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page.number},
                       sort=${'passwordHash,' + nextDir})}">
                        <span th:text="#{msg.user.list.passwordHash}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>
                <!--accountNonLocked-->
                <th th:with="
                order=${page.sort.getOrderFor('accountNonLocked')},
                dir=${order != null ? order.direction.accountNonLocked().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">

                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page.number},
                       sort=${'accountNonLocked,' + nextDir})}">
                        <span th:text="#{msg.user.list.accountNonLocked}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>
                <!--active-->
                <th th:with="
                order=${page.sort.getOrderFor('active')},
                dir=${order != null ? order.direction.active().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">

                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page.number},
                       sort=${'active,' + nextDir})}">
                        <span th:text="#{msg.user.list.active}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>
                <!--lastPasswordChange-->
                <th th:with="
                order=${page.sort.getOrderFor('lastPasswordChange')},
                dir=${order != null ? order.direction.lastPasswordChange().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">

                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page.number},
                       sort=${'lastPasswordChange,' + nextDir})}">
                        <span th:text="#{msg.user.list.lastPasswordChange}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>
                <!--passwordExpiresAt-->
                <th th:with="
                order=${page.sort.getOrderFor('passwordExpiresAt')},
                dir=${order != null ? order.direction.passwordExpiresAt().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">

                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page.number},
                       sort=${'passwordExpiresAt,' + nextDir})}">
                        <span th:text="#{msg.user.list.passwordExpiresAt}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>
                <!--failedLoginAttempts-->
                <th th:with="
                order=${page.sort.getOrderFor('failedLoginAttempts')},
                dir=${order != null ? order.direction.failedLoginAttempts().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">

                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page.number},
                       sort=${'failedLoginAttempts,' + nextDir})}">
                        <span th:text="#{msg.user.list.failedLoginAttempts}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>
                <!--emailVerified-->
                <th th:with="
                order=${page.sort.getOrderFor('emailVerified')},
                dir=${order != null ? order.direction.emailVerified().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">

                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page.number},
                       sort=${'emailVerified,' + nextDir})}">
                        <span th:text="#{msg.user.list.emailVerified}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>
                <!--mustChangePassword-->
                <th th:with="
                order=${page.sort.getOrderFor('emailVerified')},
                dir=${order != null ? order.direction.mustChangePassword().toLowerCase(): 'asc'},
                nextDir=${dir =='asc' ? 'desc': 'asc'}">

                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page.number},
                       sort=${'mustChangePassword,' + nextDir})}">
                        <span th:text="#{msg.user.list.mustChangePassword}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc'} ? '▼' : '▲'"></span>
                    </a>
                </th>
                <th th:text="#{msg.user-list.actions}">Acciones</th>
            </tr>

            </thead>

            <tbody>
            <tr th:each="user : ${listUsers}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.passwordHash}"></td>
                <td th:text="${user.accountNonLocked}"></td>
                <td th:text="${user.active}"></td>
                <td th:text="${user.lastPasswordChange}"></td>
                <td th:text="${user.passwordExpiresAt}"></td>
                <td th:text="${user.failedLoginAttempts}"></td>
                <td th:text="${user.emailVerified}"></td>
                <td th:text="${user.mustChangePassword}"></td>

                <!-- Roles -->
                <th th:text="#{msg.user-list.col.roles}">Roles</th>
                <td th:text="${#lists.isEmpty(user.roles)} ? '-' : ${#strings.listJoin(user.roles, ', ')}"></td>
                <td>
                    <!-- Ver detalle -->
                    <a th:href="@{/users/detail(id=${user.id})}"
                       class="btn btn-outline-secondary btn-sm me-1"
                       th:text="#{msg.user-list.viewDetail}"></a>

                    <a th:href="@{/users/edit(id=${user.id})}"
                       class="btn btn-primary btn-sm"
                       th:text="#{msg.user-list.edit}">
                        Editar
                    </a>

                    <form th:action="@{/users/delete}" method="post" class="d-inline">
                        <input type="hidden" name="id" th:value="${user.id}" />
                        <button type="submit" class="btn btn-danger btn-sm"
                                th:onclick="|return confirm('#{msg.user-list.confirm}');|"
                                th:text="#{msg.user-list.delete}">
                            Eliminar
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Paginación -->
        <div class="d-flex justify-content-between align-items-center mt-3"
             th:if="${page.totalPages > 0}">


            <!-- Info de página -->
            <div>
                <!-- "Página X de Y (N registros en total)" -->
                <span th:text="#{msg.pagination.info(${page.number} + 1, ${page.totalPages}, ${page.totalElements})}"></span>
            </div>


            <!-- Controles de paginación -->
            <nav th:aria-label="#{msg.pagination.aria.label}">
                <ul class="pagination mb-0">


                    <!-- Botón Anterior -->
                    <li class="page-item"
                        th:classappend="${page.first} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/users(page=${page.number - 1}, size=${page.size}, sort=${sortParam})}"
                           th:aria-label="#{msg.pagination.prev}">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>


                    <!-- Números de página -->
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                        th:classappend="${i} == ${page.number} ? ' active'">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/users(page=${i}, size=${page.size}, sort=${sortParam})}">
                        </a>
                    </li>


                    <!-- Botón Siguiente -->
                    <li class="page-item"
                        th:classappend="${page.last} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/users(page=${page.number + 1}, size=${page.size}, sort=${sortParam})}"
                           th:aria-label="#{msg.pagination.next}">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>


                </ul>
            </nav>
        </div>


        <!-- Botón volver -->
        <a th:href="@{/}" class="btn btn-secondary" th:text="#{msg.user-form.returnback}">
            Volver al inicio
        </a>
    </div>
</main>

<!-- Footer -->
<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Ticket Logger - Home')"></head>

<body class="d-flex flex-column h-100">

<!-- Header -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido dinámico -->
<main class="list-page">
    <div class="list-card">

        <!-- Título de la lista -->
        <h1 th:text="#{msg.user-list.title}">Listado de Usuarios</h1>

        <!-- Botón para añadir -->
        <a th:href="@{/users/new}" class="btn btn-success" th:text="#{msg.user-list.add}">
            Agregar Nueva Comunidad Autónoma
        </a>

        <!-- Mensaje de error -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Tabla -->
        <table class="table table-bordered table-striped mt-3">
            <thead>
            <tr>
                <th th:text="#{msg.user-list.id}">ID</th>
                <th th:text="#{msg.user-list.username}">NombreUsuario</th>
                <th th:text="#{msg.user-list.passwordHash}">PasswordHash</th>
                <th th:text="#{msg.user-list.active}">Activo</th>
                <th th:text="#{msg.user-list.accountNonLocked}">Bloqueado</th>
                <th th:text="#{msg.user-list.lastPasswordChange}">UltimoCambioContraseña</th>
                <th th:text="#{msg.user-list.passwordExpiresAt}">ExpiraciónContraseña</th>
                <th th:text="#{msg.user-list.failedLoginAttempts}">LoginFallidos</th>
                <th th:text="#{msg.user-list.emailVerified}">Email</th>
                <th th:text="#{msg.user-list.mustChangePassword}">CambiarContraseña</th>
                <th th:text="#{msg.user-list.actions}">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="user : ${listUsers}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.passwordHash}"></td>
                <td th:text="${user.active}"></td>
                <td th:text="${user.accountNonLocked}"></td>
                <td th:text="${user.lastPasswordChange}"></td>
                <td th:text="${user.passwordExpiresAt}"></td>
                <td th:text="${user.failedLoginAttempts}"></td>
                <td th:text="${user.emailVerified}"></td>
                <td th:text="${user.mustChangePassword}"></td>

                <td>
                    <a th:href="@{/users/edit(id=${user.id})}"
                       class="btn btn-primary btn-sm"
                       th:text="#{msg.user-list.edit}">
                        Editar
                    </a>

                    <form th:action="@{/users/delete}" method="post" class="d-inline">
                        <input type="hidden" name="id" th:value="${user.id}" />
                        <button type="submit" class="btn btn-danger btn-sm"
                                th:onclick="|return confirm('#{msg.user-list.confirm}');|"
                                th:text="#{msg.user-list.delete}">
                            Eliminar
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Botón volver -->
        <a th:href="@{/}" class="btn btn-secondary" th:text="#{msg.user-form.returnback}">
            Volver al inicio
        </a>
    </div>
</main>

<!-- Footer -->
<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>

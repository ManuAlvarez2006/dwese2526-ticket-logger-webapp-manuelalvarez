<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Ticket Logger - Home')"></head>

<body class="d-flex flex-column h-100">

<!-- Header -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido dinámico -->
<main class="list-page">
    <div class="list-card">

        <!-- Título de la lista -->
        <h1 th:text="#{msg.user-list.title}">Listado de Usuarios</h1>

        <!-- Botón para añadir -->
        <a th:href="@{/users/new}" class="btn btn-success" th:text="#{msg.user-list.add}">
            Agregar Nuevo Usuario
        </a>

        <!-- Mensaje de error -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Tabla -->
        <table class="table table-bordered table-striped mt-3">
            <thead>
            <tr>
                <!-- ID -->
                <th th:with="
                    order=${page != null and page.sort != null and page.sort.sorted ? page.sort.getOrderFor('id') : null},
                    dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                    nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page != null ? page.number : 0}, sort=${'id,' + nextDir})}">
                        <span th:text="#{msg.user.list.id}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▼' : '▲'}"></span>
                    </a>
                </th>

                <!-- Email -->
                <th th:with="
                    order=${page != null and page.sort != null and page.sort.sorted ? page.sort.getOrderFor('email') : null},
                    dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                    nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page != null ? page.number : 0}, sort=${'email,' + nextDir})}">
                        <span th:text="#{msg.user.list.email}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▼' : '▲'}"></span>
                    </a>
                </th>

                <!-- passwordHash -->
                <th th:with="
                    order=${page != null and page.sort != null and page.sort.sorted ? page.sort.getOrderFor('passwordHash') : null},
                    dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                    nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page != null ? page.number : 0}, sort=${'passwordHash,' + nextDir})}">
                        <span th:text="#{msg.user.list.passwordHash}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▼' : '▲'}"></span>
                    </a>
                </th>

                <!-- accountNonLocked -->
                <th th:with="
                    order=${page != null and page.sort != null and page.sort.sorted ? page.sort.getOrderFor('accountNonLocked') : null},
                    dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                    nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page != null ? page.number : 0}, sort=${'accountNonLocked,' + nextDir})}">
                        <span th:text="#{msg.user.list.accountNonLocked}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▼' : '▲'}"></span>
                    </a>
                </th>

                <!-- active -->
                <th th:with="
                    order=${page != null and page.sort != null and page.sort.sorted ? page.sort.getOrderFor('active') : null},
                    dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                    nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page != null ? page.number : 0}, sort=${'active,' + nextDir})}">
                        <span th:text="#{msg.user.list.active}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▼' : '▲'}"></span>
                    </a>
                </th>

                <!-- lastPasswordChange -->
                <th th:with="
                    order=${page != null and page.sort != null and page.sort.sorted ? page.sort.getOrderFor('lastPasswordChange') : null},
                    dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                    nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page != null ? page.number : 0}, sort=${'lastPasswordChange,' + nextDir})}">
                        <span th:text="#{msg.user.list.lastPasswordChange}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▼' : '▲'}"></span>
                    </a>
                </th>

                <!-- passwordExpiresAt -->
                <th th:with="
                    order=${page != null and page.sort != null and page.sort.sorted ? page.sort.getOrderFor('passwordExpiresAt') : null},
                    dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                    nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page != null ? page.number : 0}, sort=${'passwordExpiresAt,' + nextDir})}">
                        <span th:text="#{msg.user.list.passwordExpiresAt}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▼' : '▲'}"></span>
                    </a>
                </th>

                <!-- failedLoginAttempts -->
                <th th:with="
                    order=${page != null and page.sort != null and page.sort.sorted ? page.sort.getOrderFor('failedLoginAttempts') : null},
                    dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                    nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page != null ? page.number : 0}, sort=${'failedLoginAttempts,' + nextDir})}">
                        <span th:text="#{msg.user.list.failedLoginAttempts}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▼' : '▲'}"></span>
                    </a>
                </th>

                <!-- emailVerified -->
                <th th:with="
                    order=${page != null and page.sort != null and page.sort.sorted ? page.sort.getOrderFor('emailVerified') : null},
                    dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                    nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page != null ? page.number : 0}, sort=${'emailVerified,' + nextDir})}">
                        <span th:text="#{msg.user.list.emailVerified}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▼' : '▲'}"></span>
                    </a>
                </th>

                <!-- mustChangePassword -->
                <th th:with="
                    order=${page != null and page.sort != null and page.sort.sorted ? page.sort.getOrderFor('mustChangePassword') : null},
                    dir=${order != null ? order.direction.name().toLowerCase() : 'asc'},
                    nextDir=${dir == 'asc' ? 'desc' : 'asc'}">
                    <a class="text-decoration-none"
                       th:href="@{/users(page=${page != null ? page.number : 0}, sort=${'mustChangePassword,' + nextDir})}">
                        <span th:text="#{msg.user.list.mustChangePassword}"></span>
                        <span class="ms-1" th:if="${order != null}" th:text="${dir == 'asc' ? '▼' : '▲'}"></span>
                    </a>
                </th>

                <!-- Acciones -->
                <th th:text="#{msg.user-list.actions}">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="user : ${page != null ? page.content : {}}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.passwordHash}"></td>
                <td th:text="${user.accountNonLocked}"></td>
                <td th:text="${user.active}"></td>
                <td th:text="${user.lastPasswordChange}"></td>
                <td th:text="${user.passwordExpiresAt}"></td>
                <td th:text="${user.failedLoginAttempts}"></td>
                <td th:text="${user.emailVerified}"></td>
                <td th:text="${user.mustChangePassword}"></td>
                <td th:text="${#lists.isEmpty(user.roles) ? '-' : #strings.listJoin(user.roles, ', ')}"></td>
                <td>
                    <a th:href="@{/users/detail(id=${user.id})}" class="btn btn-outline-secondary btn-sm me-1" th:text="#{msg.user-list.viewDetail}"></a>
                    <a th:href="@{/users/edit(id=${user.id})}" class="btn btn-primary btn-sm" th:text="#{msg.user-list.edit}"></a>
                    <form th:action="@{/users/delete}" method="post" class="d-inline">
                        <input type="hidden" name="id" th:value="${user.id}" />
                        <button type="submit" class="btn btn-danger btn-sm"
                                th:onclick="|return confirm('#{msg.user-list.confirm}');|"
                                th:text="#{msg.user-list.delete}"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Paginación -->
        <div class="d-flex justify-content-between align-items-center mt-3" th:if="${page != null and page.totalPages > 0}">
            <div>
                <span th:text="#{msg.pagination.info(${page.number + 1}, ${page.totalPages}, ${page.totalElements})}"></span>
            </div>
            <nav th:aria-label="#{msg.pagination.aria.label}">
                <ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                        <a class="page-link" th:href="@{/users(page=${page.number - 1}, size=${page.size}, sort=${sortParam})}" th:aria-label="#{msg.pagination.prev}">&laquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i} == ${page.number} ? ' active'">
                        <a class="page-link" th:text="${i + 1}" th:href="@{/users(page=${i}, size=${page.size}, sort=${sortParam})}"></a>
                    </li>
                    <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                        <a class="page-link" th:href="@{/users(page=${page.number + 1}, size=${page.size}, sort=${sortParam})}" th:aria-label="#{msg.pagination.next}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Botón volver -->
        <a th:href="@{/}" class="btn btn-secondary" th:text="#{msg.user-form.returnback}">Volver al inicio</a>
    </div>
</main>

<!-- Footer -->
<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Ticket Logger - Detail')"></head>

<body class="d-flex flex-column h-100">
<header th:replace="fragments/header :: header"></header>

<main class="form-page">
    <div class="form-card">

        <!-- Título: Detalle Usuario: {username} -->
        <h1>
            <span th:text="#{msg.user-detail.title}">Detalle Usuario</span>:
            <span th:text="${user.username}"></span>
        </h1>

        <!-- Datos básicos del usuario -->
        <div class="mt-3">
            <h2 class="h5" th:text="#{msg.user-detail.section.userData}">Datos del Usuario</h2>
            <dl class="row">

                <dt class="col-sm-3" th:text="#{msg.user-detail.field.id}">ID</dt>
                <dd class="col-sm-9" th:text="${user.id}"></dd>

                <dt class="col-sm-3" th:text="#{msg.user-detail.field.username}">Nombre de Usuario</dt>
                <dd class="col-sm-9" th:text="${user.username}"></dd>

                <dt class="col-sm-3" th:text="#{msg.user-detail.field.passwordHash}">Contraseña</dt>
                <dd class="col-sm-9" th:text="${user.passwordHash}"></dd>

                <dt class="col-sm-3" th:text="#{msg.user-detail.field.accountNonLocked}">Cuenta Desbloqueada</dt>
                <dd class="col-sm-9" th:text="${user.accountNonLocked}"></dd>

                <dt class="col-sm-3" th:text="#{msg.user-detail.field.active}">Activo</dt>
                <dd class="col-sm-9" th:text="${user.active}"></dd>

                <dt class="col-sm-3" th:text="#{msg.user-detail.field.lastPasswordChange}">Último Cambio de Contraseña</dt>
                <dd class="col-sm-9" th:text="${user.lastPasswordChange}"></dd>

                <dt class="col-sm-3" th:text="#{msg.user-detail.field.passwordExpiresAt}">Contraseña Expira En</dt>
                <dd class="col-sm-9" th:text="${user.passwordExpiresAt}"></dd>

                <dt class="col-sm-3" th:text="#{msg.user-detail.field.failedLoginAttempts}">Intentos Fallidos</dt>
                <dd class="col-sm-9" th:text="${user.failedLoginAttempts}"></dd>

                <dt class="col-sm-3" th:text="#{msg.user-detail.field.emailVerified}">Correo Verificado</dt>
                <dd class="col-sm-9" th:text="${user.emailVerified}"></dd>

                <dt class="col-sm-3" th:text="#{msg.user-detail.field.mustChangePassword}">Debe Cambiar Contraseña</dt>
                <dd class="col-sm-9" th:text="${user.mustChangePassword}"></dd>

            </dl>
        </div>

        <a th:href="@{/users}" class="btn btn-secondary mt-3" th:text="#{msg.user-detail.button.back}">Volver al listado</a>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>
</body>
</html>

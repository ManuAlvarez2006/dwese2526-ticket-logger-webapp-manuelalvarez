<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Ticket Logger - Form')"></head>

<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>

<main class="form-page">
    <div class="form-card">

        <!-- ✅ Encabezado internacionalizado -->
        <h1 th:if="${user.id == null}" th:text="#{msg.user-form.add}">Nuevo Usuario</h1>
        <h1 th:unless="${user.id == null}" th:text="#{msg.user-form.edit}">Editar Usuario</h1>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="${user.id == null} ? @{/users/insert} : @{/users/update}"
              th:object="${user}" method="post" class="mt-3">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="username" class="form-label" th:text="#{msg.user-form.username}">NombreUsuario:</label>
                <input type="text" th:field="*{username}" id="username" class="form-control"/>
                <div th:if="${#fields.hasErrors('username')}" class="text-danger" th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label for="passwordHash" class="form-label" th:text="#{msg.user-form.passwordHash}">PasswordHash:</label>
                <input type="text" th:field="*{passwordHash}" id="passwordHash" class="form-control"/>
                <div th:if="${#fields.hasErrors('passwordHash')}" class="text-danger" th:errors="*{passwordHash}"></div>
            </div>

            <div class="mb-3">
                <label for="accountNonLocked" class="form-label" th:text="#{msg.user-form.accountNonLocked}">CuentaBloqueada:</label>
                <input class="form-check-input" type="checkbox"  th:field="*{accountNonLocked}" id="accountNonLocked"/>
                <div th:if="${#fields.hasErrors('accountNonLocked')}" class="text-danger" th:errors="*{accountNonLocked}"></div>
            </div>
            <div class="mb-3">
                <label for="active" class="form-label" th:text="#{msg.user-form.active}">Activo:</label>
                <input class="form-check-input" type="checkbox"  th:field="*{active}" id="active"/>
                <div th:if="${#fields.hasErrors('active')}" class="text-danger" th:errors="*{active}"></div>
            </div>
            <div class="mb-3">
                <label for="lastPasswordChange" class="form-label" th:text="#{msg.user-form.lastPasswordChange}">UltimoCambioContraseña:</label>
                <input type="datetime-local" th:field="*{lastPasswordChange}" id="lastPasswordChange" class="form-control"/>
                <div th:if="${#fields.hasErrors('lastPasswordChange')}" class="text-danger" th:errors="*{lastPasswordChange}"></div>
            </div>
            <div class="mb-3">
                <label for="passwordExpiresAt" class="form-label" th:text="#{msg.user-form.passwordExpiresAt}">ContraseñaExpira:</label>
                <input type="datetime-local" th:field="*{passwordExpiresAt}" id="passwordExpiresAt" class="form-control"/>
                <div th:if="${#fields.hasErrors('passwordExpiresAt')}" class="text-danger" th:errors="*{passwordExpiresAt}"></div>
            </div>
            <div class="mb-3">
                <label for="failedLoginAttempts" class="form-label" th:text="#{msg.user-form.failedLoginAttempts}">LoginFallidos:</label>
                <input type="number" th:field="*{failedLoginAttempts}" id="failedLoginAttempts" class="form-control"/>
                <div th:if="${#fields.hasErrors('failedLoginAttempts')}" class="text-danger" th:errors="*{failedLoginAttempts}"></div>
            </div>
            <div class="mb-3">
                <label for="mustChangePassword" class="form-label" th:text="#{msg.user-form.mustChangePassword}">CambiarContraseña:</label>
                <input class="form-check-input" type="checkbox"  th:field="*{mustChangePassword}" id="mustChangePassword"/>
                <div th:if="${#fields.hasErrors('mustChangePassword')}" class="text-danger" th:errors="*{mustChangePassword}"></div>
            </div>
            <div class="mb-3">
                <label for="emailVerified" class="form-label" th:text="#{msg.user-form.emailVerified}">Email Verificado:</label>
                <input class="form-check-input" type="checkbox" th:field="*{emailVerified}" id="emailVerified"/>
                <div th:if="${#fields.hasErrors('emailVerified')}" class="text-danger" th:errors="*{emailVerified}"></div>
            </div>

            <button type="submit" class="btn btn-primary"
                    th:text="${user.id == null} ? #{msg.user-form.create} : #{msg.user-form.update}">
                Crear
            </button>

            <a th:href="@{/users}" class="btn btn-secondary" th:text="#{msg.user-form.returnback}">
                Volver a la lista
            </a>

        </form>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>

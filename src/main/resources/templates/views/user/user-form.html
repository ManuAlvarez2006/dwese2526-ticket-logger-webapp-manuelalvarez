<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Perfil de Usuario')"></head>
<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>

<main class="form-page">
    <div class="form-card">

        <!-- Título dinámico -->
        <h1 th:text="${user.id == null} ? #{msg.userProfile.title.create} : #{msg.userProfile.title.edit}">
            Perfil de Usuario
        </h1>

        <!-- Mensajes -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <!-- FORMULARIO -->
        <form th:object="${user}"
              th:action="${user.id == null} ? @{/users/insert} : @{/users/update}"
              method="post"
              class="mt-3">

            <input type="hidden" th:field="*{id}"/>

            <!-- ROLES -->
            <div class="mb-3">
                <label for="roles" class="form-label"
                       th:text="#{msg.user-form.roles}">Roles</label>

                <select id="roles"
                        class="form-select"
                        multiple
                        th:field="*{roleIds}">
                    <option th:each="role : ${allRoles}"
                            th:value="${role.id}"
                            th:text="${role.displayName + ' (' + role.name + ')'}">
                    </option>
                </select>
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
                <label for="email" class="form-label"
                       th:text="#{msg.user.list.email_en}">Email</label>
                <input type="text" th:field="*{email}" id="email" class="form-control"/>
                <div th:if="${#fields.hasErrors('email')}"
                     class="text-danger"
                     th:errors="*{email}"></div>
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label for="passwordHash" class="form-label"
                       th:text="#{msg.user-form.label.password}">Password</label>
                <input type="password" th:field="*{passwordHash}" id="passwordHash" class="form-control"/>
                <div th:if="${#fields.hasErrors('passwordHash')}"
                     class="text-danger"
                     th:errors="*{passwordHash}"></div>
            </div>

            <!-- ACCOUNT NON LOCKED -->
            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{accountNonLocked}" id="accountNonLocked"
                       class="form-check-input"/>
                <label for="accountNonLocked" class="form-check-label"
                       th:text="#{msg.user-form.label.accountNonLocked}">
                    Account Unlocked
                </label>
            </div>

            <!-- ACTIVE -->
            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{active}" id="active"
                       class="form-check-input"/>
                <label for="active" class="form-check-label"
                       th:text="#{msg.user-form.label.active}">
                    Active
                </label>
            </div>

            <!-- LAST PASSWORD CHANGE -->
            <div class="mb-3">
                <label for="lastPasswordChange" class="form-label"
                       th:text="#{msg.user-form.label.lastPasswordChange}">
                    Last Password Change
                </label>
                <input type="datetime-local"
                       th:field="*{lastPasswordChange}"
                       id="lastPasswordChange"
                       class="form-control"/>
                <div th:if="${#fields.hasErrors('lastPasswordChange')}"
                     class="text-danger"
                     th:errors="*{lastPasswordChange}"></div>
            </div>

            <!-- FAILED LOGIN ATTEMPTS -->
            <div class="mb-3">
                <label for="failedLoginAttempts" class="form-label"
                       th:text="#{msg.user-form.label.failedLoginAttempts}">
                    Failed Login Attempts
                </label>
                <input type="number"
                       th:field="*{failedLoginAttempts}"
                       id="failedLoginAttempts"
                       class="form-control"/>
                <div th:if="${#fields.hasErrors('failedLoginAttempts')}"
                     class="text-danger"
                     th:errors="*{failedLoginAttempts}"></div>
            </div>

            <!-- EMAIL VERIFIED -->
            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{emailVerified}" id="emailVerified"
                       class="form-check-input"/>
                <label for="emailVerified" class="form-check-label"
                       th:text="#{msg.user-form.label.emailVerified}">
                    Email Verified
                </label>
            </div>

            <!-- MUST CHANGE PASSWORD -->
            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{mustChangePassword}" id="mustChangePassword"
                       class="form-check-input"/>
                <label for="mustChangePassword" class="form-check-label"
                       th:text="#{msg.user-form.label.mustChangePassword}">
                    Must Change Password
                </label>
            </div>

            <!-- BOTONES -->
            <button type="submit" class="btn btn-primary"
                    th:text="${user.id == null} ? #{msg.user-form.button.create} : #{msg.user-form.button.update}">
                Guardar
            </button>

            <a th:href="@{/users}" class="btn btn-secondary"
               th:text="#{msg.user-form.button.back}">
                Volver
            </a>

        </form>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>

<head th:fragment ="head(title)" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <meta charset ="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text = "${title} ?: 'Ticket Logger?'">Ticket Logger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<link rel = "stylesheet" th:href="@{/css/styles.css}">

    <!-- Botón de Login (solo si NO autenticado) -->
    <div sec:authorize="!isAuthenticated()">
        <a class="btn btn-outline-primary btn-sm" th:href="@{/login}">
        </a>
        Login
    </div>

    <li>
        <form th:action="@{/logout}" method="post" class="m-0"> <button type="submit" class="dropdown-item text-danger"> Cerrar sesión
        </button>
        </form>
    </li>
    <!-- Texto bienvenida (solo autenticado) -->
    <div class="d-none d-lg-flex align-items-center me-3"
         sec:authorize="isAuthenticated()">
        <span class="small text-secondary fw-medium me-1">Bienvenido,</span>
        <span class="small fw-semibold text-primary text-truncate" style="max-width:220px"
              sec:authentication="name"></span>
    </div>

</head>
